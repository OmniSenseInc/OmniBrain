# Reverse proxy nginx → app lokal (ganti <DOMAIN> dan <APP_PORT>)
# Pasang ke /etc/nginx/sites-available/, symlink ke sites-enabled/, hapus default,
# lalu: nginx -t && systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name <DOMAIN> www.<DOMAIN>;

    # Samakan dengan batas body app (mis. app memakai 50 KB → 60k)
    client_max_body_size 60k;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:<APP_PORT>;
        proxy_http_version 1.1;

        # Host asli pengunjung (app sering memvalidasi ini)
        proxy_set_header Host $host;

        # Skema asli: Cloudflare/CDN mengirim ini (https). Kosong bila akses langsung.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # IP asli pengunjung dari CDN + fallback
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
